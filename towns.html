<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="周辺の仮想街。仮想の街『もり』『ふくろい』『かけがわ』の17テーマ分析への入口。">
<title>周辺の仮想街</title>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b;
  --accent:#1f6feb; --accent-soft:#e8f0fe; --line:#e5e0d8; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.7}
header.top{background:#1c2b39;color:#fff;padding:20px 16px}
header.top h1{margin:0 0 4px;font-size:1.25rem}
header.top p{margin:0;color:#c8d3de;font-size:.85rem}
nav.bread{padding:10px 16px;font-size:.85rem;color:var(--muted)}
nav.bread a{color:var(--accent);text-decoration:none}
main{max-width:960px;margin:0 auto;padding:0 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{margin:0 0 8px;font-size:1.05rem}
.card ul{margin:0;padding-left:1.4em}
.card li{margin:4px 0}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
.card a{color:var(--accent)}
.src{font-size:.78rem;color:var(--muted);margin-top:10px}
.src a{color:var(--accent)}
footer{border-top:1px solid var(--line);padding:16px;text-align:center;
  font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
<h1>周辺の仮想街</h1>
</header>
<nav class="bread"><a href="index.html">管理人の部屋（トップ）</a></nav>
<main>
<section class="card">
<p>中心の『いわた』以外の仮想の街の、17テーマ分析への入口をまとめた置き場です。</p>
<ul>
<li><a href="mori17/">仮想街もり 17テーマ</a>：仮想の街『もり』の17テーマ分析。</li>
<li><a href="fukuroi17/">仮想街ふくろい 17テーマ</a>：仮想の街『ふくろい』の17テーマ分析。</li>
<li><a href="kakegawa17/">仮想街かけがわ 17テーマ</a>：仮想の街『かけがわ』の17テーマ分析。</li>
<li><a href="fujieda17/">仮想街ふじえだ 17テーマ</a>：仮想の街『ふじえだ』の17テーマ分析。</li>
<li><a href="kikugawa17/">仮想街きくがわ 17テーマ</a>：仮想の街『きくがわ』の17テーマ分析。</li>
<li><a href="kosai17/">仮想街こさい 17テーマ</a>：仮想の街『こさい』の17テーマ分析。</li>
</ul>
</section>
</main>
<footer>周辺の仮想街</footer>
</body>
</html>
